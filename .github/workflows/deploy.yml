name: Deploy

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 13 * * *'  # 13:00 UTC daily (1 hour after publish)

permissions:
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: blog

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
