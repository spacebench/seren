name: Publish

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 12 * * *'  # 12:00 UTC daily

env:
  OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
  PUBLISH_MODEL: ${{ vars.PUBLISH_MODEL }}
  COMMIT_SUFFIX: "\n\n---\n\nonce done then commit and push everything."

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl

      - name: Install opencode
        run: curl -fsSL https://opencode.ai/install | bash && echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Clone repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create data folder
        run: mkdir -p data

      - name: Set model flag
        run: |
          if [ -n "$PUBLISH_MODEL" ]; then
            echo "MODEL_FLAG=--model $PUBLISH_MODEL" >> $GITHUB_ENV
          else
            echo "MODEL_FLAG=" >> $GITHUB_ENV
          fi

      - name: Write article
        run: opencode run "/write-article then do not commit." $MODEL_FLAG

      - name: Publish new draft
        run: |
          DRAFT=$(git ls-files --others --exclude-standard drafts/)
          if [ -z "$DRAFT" ]; then
            echo "::error::write-article produced no new draft in drafts/."
            exit 1
          fi
          opencode run "/publish-local $DRAFT$COMMIT_SUFFIX" $MODEL_FLAG
